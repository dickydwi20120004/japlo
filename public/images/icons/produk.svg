  <!-- Tanda panah -->
  <circle cx="54" cy="32" r="5" fill="#8B5CF6"/>
  <path d="M52 32 L54 29 L56 32" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="54" y1="29" x2="54" y2="35" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
